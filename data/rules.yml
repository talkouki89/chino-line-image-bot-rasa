version: "3.1"

rules:
  - rule: Greet
    steps:
      - intent: greet
      - action: utter_greet

  - rule: Help
    steps:
      - intent: help
      - action: action_show_help

  - rule: Status
    steps:
      - intent: status
      - action: utter_status

  - rule: Fallback
    steps:
      - intent: nlu_fallback
      - action: action_default_fallback
